# 매일 KAMIS 가격 수집 → 분석 → 웹앱 배포 (GitHub Pages)
#
# 저장소 Settings 에서 할 일
#  1) Secrets and variables > Actions > New repository secret
#       KAMIS_CERT_KEY = KAMIS에서 발급받은 인증키
#       KAMIS_CERT_ID  = KAMIS 회원 아이디
#  2) Pages > Build and deployment > Source: GitHub Actions
#  3) 처음 한 번: Actions 탭 > "가격 수집·배포" > Run workflow 에서 backfill_days=730 으로 실행
#
# SQLite 파일은 'db' 라는 이름의 Release 첨부파일로 보관한다(매일 덮어씀).
name: 가격 수집·배포

on:
  schedule:
    # KST 18:13 / 21:13, 월~토 (UTC 기준 09:13 / 12:13). 두 번째는 늦게 올라온 가격 보충용.
    - cron: "13 9 * * 1-6"
    - cron: "13 12 * * 1-6"
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "과거 며칠치를 채울까요? (처음엔 730, 평소엔 0)"
        default: "0"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: farmsignal-daily
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      KAMIS_CERT_KEY: ${{ secrets.KAMIS_CERT_KEY }}
      KAMIS_CERT_ID: ${{ secrets.KAMIS_CERT_ID }}
      FARMSIGNAL_DB: pipeline/data/farmsignal.sqlite3
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      - name: 저장된 DB 내려받기
        run: |
          mkdir -p pipeline/data
          gh release download db --pattern farmsignal.sqlite3 --dir pipeline/data || echo "첫 실행: 새 DB를 만듭니다"

      - name: 테스트
        working-directory: pipeline
        run: python -m unittest discover -s tests

      - name: 과거 데이터 채우기
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.backfill_days != '0' }}
        working-directory: pipeline
        run: python -m farmsignal backfill --days ${{ github.event.inputs.backfill_days }}

      - name: 오늘 수집
        working-directory: pipeline
        run: python -m farmsignal collect

      - name: 분석·내보내기
        working-directory: pipeline
        run: |
          python -m farmsignal export --out ../web/data
          python -m farmsignal status

      - name: DB 보관
        if: always()
        run: |
          [ -f pipeline/data/farmsignal.sqlite3 ] || exit 0
          gh release view db >/dev/null 2>&1 || gh release create db --title "가격 DB" --notes "자동 수집 SQLite (매일 갱신)" --latest=false
          gh release upload db pipeline/data/farmsignal.sqlite3 --clobber

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
