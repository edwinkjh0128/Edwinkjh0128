<title>팜시그널 농산물 시세</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 모바일 우선 앱 셸 — 상단 기준일 바 + 단일 컬럼 카드 흐름 + 하단 탭바. 넓은 화면은 가운데 640px 칼럼. */
:root {
  --bg: #f3f5f1;
  --surface: #ffffff;
  --surface-2: #e9eee6;
  --line: #d5ddd1;
  --fg: #16231a;
  --fg-2: #48584d;
  --fg-3: #75837a;
  --brand: #1d5b39;
  --brand-ink: #ffffff;
  --accent: #9a6410;          /* 예측(오커) */
  --band: rgba(154, 100, 16, .16);
  --normal: #8a9a8f;          /* 평년선 */
  --up: #cf2f36;              /* 상승: 국내 시세 관례상 빨강 */
  --down: #2462c8;            /* 하락: 파랑 */
  --up-soft: rgba(207, 47, 54, .1);
  --down-soft: rgba(36, 98, 200, .1);
  --good-soft: rgba(29, 91, 57, .1);
  --accent-soft: rgba(154, 100, 16, .12);
  --shadow: 0 1px 2px rgba(22, 35, 26, .06), 0 2px 10px rgba(22, 35, 26, .04);
  --f-display: "Gowun Batang", "Nanum Myeongjo", "AppleMyungjo", serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1511; --surface: #172019; --surface-2: #202a22; --line: #2d3a30;
    --fg: #e7eee8; --fg-2: #a8b6ab; --fg-3: #77857b; --brand: #6fcf97; --brand-ink: #0f1511;
    --accent: #e3ad52; --band: rgba(227, 173, 82, .18); --normal: #6f7f74;
    --up: #ff6b6e; --down: #5d9dff; --up-soft: rgba(255, 107, 110, .13); --down-soft: rgba(93, 157, 255, .13);
    --good-soft: rgba(111, 207, 151, .12); --accent-soft: rgba(227, 173, 82, .13);
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1511; --surface: #172019; --surface-2: #202a22; --line: #2d3a30;
  --fg: #e7eee8; --fg-2: #a8b6ab; --fg-3: #77857b; --brand: #6fcf97; --brand-ink: #0f1511;
  --accent: #e3ad52; --band: rgba(227, 173, 82, .18); --normal: #6f7f74;
  --up: #ff6b6e; --down: #5d9dff; --up-soft: rgba(255, 107, 110, .13); --down-soft: rgba(93, 157, 255, .13);
  --good-soft: rgba(111, 207, 151, .12); --accent-soft: rgba(227, 173, 82, .13);
  --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  word-break: keep-all; overflow-wrap: anywhere;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 6px; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* 상단 바 */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 10px; padding-block: 10px; min-height: 54px; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; letter-spacing: -.02em; font-size: 17px; }
.brand svg { flex: none; }
.asof { margin-left: auto; text-align: right; font-size: 12px; color: var(--fg-3); line-height: 1.3; }
.asof b { color: var(--fg-2); font-weight: 600; display: block; font-size: 13px; }
.back { display: inline-flex; align-items: center; gap: 2px; border: 0; background: none; padding: 6px 8px 6px 0; color: var(--fg-2); font-weight: 600; }

.demo { margin: 12px 0 0; padding: 10px 12px; border-radius: 10px; background: var(--accent-soft); color: var(--fg-2); font-size: 13px; line-height: 1.45; }
.demo b { color: var(--accent); }

main { padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
.view { display: flex; flex-direction: column; gap: 14px; padding-block: 14px 8px; }

/* 카드 · 섹션 */
.card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); border: 1px solid var(--line); padding: 16px; min-width: 0; }
.sec-h { display: flex; align-items: baseline; gap: 8px; margin: 0 0 10px; }
.sec-h h2 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: -.02em; }
.sec-h .sub { color: var(--fg-3); font-size: 12px; }
.sec-h .more { margin-left: auto; font-size: 13px; color: var(--brand); font-weight: 600; text-decoration: none; background: none; border: 0; padding: 0; }
.hint { color: var(--fg-3); font-size: 12px; margin: 10px 0 0; }

/* 히어로(오늘의 시장) */
.hero h1 { font-family: var(--f-display); font-size: 26px; line-height: 1.25; margin: 2px 0 6px; letter-spacing: -.01em; text-wrap: balance; }
.hero p { margin: 0; color: var(--fg-2); font-size: 14px; }
.eyebrow { font-size: 12px; color: var(--fg-3); letter-spacing: .04em; font-weight: 600; }

/* 세그먼트 · 칩 */
.seg { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--fg-2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 500; color: var(--fg-2); }
.chip[aria-pressed="true"] { background: var(--fg); border-color: var(--fg); color: var(--bg); }

/* 등락 */
.up { color: var(--up); }
.down { color: var(--down); }
.flat { color: var(--fg-3); }
.delta { font-family: var(--f-num); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }

/* 부류 지수 */
.cats { display: grid; gap: 2px; }
.cat-row { display: grid; grid-template-columns: 64px 1fr 62px; align-items: center; gap: 10px; padding: 7px 0; font-size: 14px; }
.cat-row .nm { font-weight: 600; }
.dbar { position: relative; height: 22px; }
.dbar .axis { position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--line); }
.dbar .fill { position: absolute; top: 4px; height: 14px; border-radius: 4px; }
.cat-row .v { text-align: right; font-size: 13px; }
.cat-legend { display: flex; justify-content: space-between; font-size: 11px; color: var(--fg-3); padding: 0 72px 0 74px; }

/* 품목 행 */
.list { display: flex; flex-direction: column; }
.row { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); text-decoration: none; color: inherit; }
.row:first-child { border-top: 0; }
.row .t { min-width: 0; }
.row .nm { font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.row .meta { color: var(--fg-3); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .r { text-align: right; }
.row .p { font-family: var(--f-num); font-weight: 600; font-size: 15px; font-variant-numeric: tabular-nums; }
.row .p small { font-family: var(--f-body); font-weight: 400; color: var(--fg-3); font-size: 11px; margin-left: 2px; }
.row .s { font-size: 12px; display: flex; gap: 8px; justify-content: flex-end; align-items: center; }
.tag { font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 5px; background: var(--surface-2); color: var(--fg-2); }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
.pill.sell, .pill.sell_soft { background: var(--good-soft); color: var(--brand); }
.pill.hold, .pill.hold_soft { background: var(--accent-soft); color: var(--accent); }
.pill.neutral { background: var(--surface-2); color: var(--fg-2); }
.pill.none, .pill.off { background: var(--surface-2); color: var(--fg-3); }

/* 신호 카드 */
.sig { display: flex; flex-direction: column; gap: 6px; padding: 12px 0; border-top: 1px solid var(--line); text-decoration: none; color: inherit; }
.sig:first-of-type { border-top: 0; padding-top: 2px; }
.sig .h { display: flex; align-items: center; gap: 8px; }
.sig .h .nm { font-weight: 600; }
.sig .h .pill { margin-left: auto; }
.sig .why { color: var(--fg-2); font-size: 13px; }

/* 위치 바(1년 범위) */
.range { position: relative; height: 6px; border-radius: 3px; background: var(--surface-2); }
.range i { position: absolute; top: -4px; width: 14px; height: 14px; border-radius: 50%; background: var(--fg); border: 3px solid var(--surface); transform: translateX(-50%); box-shadow: 0 0 0 1px var(--line); }
.range-l { display: flex; justify-content: space-between; font-size: 12px; color: var(--fg-3); margin-top: 8px; }

/* 상세 */
.dt-h .kind { color: var(--fg-3); font-size: 13px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.dt-h h1 { font-family: var(--f-display); font-size: 30px; margin: 4px 0 2px; letter-spacing: -.01em; display: flex; align-items: center; gap: 10px; }
.star { margin-left: auto; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; color: var(--fg-2); display: inline-flex; gap: 6px; align-items: center; }
.star[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
.big { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.big .p { font-family: var(--f-num); font-size: 34px; font-weight: 600; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.big .u { color: var(--fg-3); font-size: 14px; }
.chg-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 14px; }
.chg-grid div { background: var(--surface-2); border-radius: 10px; padding: 8px 4px; text-align: center; min-width: 0; }
.chg-grid span { display: block; font-size: 11px; color: var(--fg-3); }
.chg-grid b { font-size: 13px; }

.chart-wrap { position: relative; margin: 6px -4px 0; touch-action: pan-y; }
.chart-wrap svg { display: block; width: 100%; overflow: visible; }
.chart-wrap text { font-family: var(--f-num); font-size: 10.5px; fill: var(--fg-3); }
.tip { position: absolute; top: 0; pointer-events: none; background: var(--fg); color: var(--bg); border-radius: 8px; padding: 6px 9px; font-size: 12px; line-height: 1.45; white-space: nowrap; transform: translateX(-50%); z-index: 2; }
.tip b { font-family: var(--f-num); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--fg-2); margin-top: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 16px; height: 0; border-top: 2px solid; display: inline-block; }
.legend i.band { height: 10px; border: 0; background: var(--band); border-radius: 2px; }

.fc-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.fc-table th { text-align: left; font-weight: 500; color: var(--fg-3); font-size: 12px; padding: 0 0 6px; }
.fc-table th:not(:first-child), .fc-table td:not(:first-child) { text-align: right; }
.fc-table td { padding: 9px 0; border-top: 1px solid var(--line); }
.fc-table td.num { font-weight: 600; }
.fc-table .rg { color: var(--fg-3); font-size: 12px; font-family: var(--f-num); }

.metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.metric { background: var(--surface-2); border-radius: 12px; padding: 12px; min-width: 0; }
.metric .k { font-size: 12px; color: var(--fg-3); }
.metric .v { font-size: 19px; font-weight: 600; font-family: var(--f-num); margin-top: 2px; }
.metric .d { font-size: 12px; color: var(--fg-2); margin-top: 2px; }

.reasons { margin: 10px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.reasons li { font-size: 14px; color: var(--fg-2); padding-left: 14px; position: relative; }
.reasons li::before { content: ""; position: absolute; left: 2px; top: .62em; width: 5px; height: 5px; border-radius: 50%; background: var(--fg-3); }
.sig-big { display: flex; align-items: center; gap: 10px; }
.sig-big .pill { font-size: 14px; padding: 6px 12px; }

.months { display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px; align-items: end; height: 120px; margin-top: 8px; }
.months div { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; gap: 4px; min-width: 0; }
.months i { width: 100%; max-width: 22px; border-radius: 4px 4px 0 0; background: var(--surface-2); display: block; }
.months i.hi { background: var(--up); opacity: .75; }
.months i.lo { background: var(--down); opacity: .75; }
.months i.now { outline: 2px solid var(--fg); outline-offset: 1px; }
.months span { font-size: 10.5px; color: var(--fg-3); font-family: var(--f-num); }

.search { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 11px 14px 11px 38px; font-size: 15px; background-image: none; }
.search-box { position: relative; }
.search-box svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--fg-3); }
.toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.toolbar select { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 7px 10px; font-size: 13px; margin-left: auto; }

.empty { text-align: center; padding: 28px 12px; color: var(--fg-3); font-size: 14px; }
.empty b { display: block; color: var(--fg); font-size: 16px; margin-bottom: 4px; }
.disclaimer { font-size: 12px; color: var(--fg-3); line-height: 1.6; margin: 4px 2px 0; }
.method h3 { font-size: 15px; margin: 18px 0 6px; }
.method h3:first-child { margin-top: 0; }
.method p, .method li { font-size: 14px; color: var(--fg-2); max-width: 62ch; }
.method ul { padding-left: 18px; margin: 6px 0; }
.trust { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.trust div { min-width: 0; }
.trust b { display: block; font-family: var(--f-num); font-size: 18px; }
.trust span { font-size: 12px; color: var(--fg-3); }

/* 탭바 */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs .wrap { display: grid; grid-template-columns: repeat(4, 1fr); }
.tabs a { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 9px 0 8px; font-size: 11px; font-weight: 600; color: var(--fg-3); text-decoration: none; }
.tabs a[aria-current="page"] { color: var(--brand); }

.skel { background: linear-gradient(90deg, var(--surface-2), var(--line), var(--surface-2)); background-size: 200% 100%; animation: sh 1.2s infinite; border-radius: 8px; height: 16px; }
@keyframes sh { to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { .skel { animation: none; } }
@media (min-width: 560px) { .hero h1 { font-size: 30px; } }
</style>

<header class="top">
  <div class="wrap" id="topbar">
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20h18" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M5 16l4-5 3 3 4-6 3 4" stroke="var(--brand)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M16 8c0-2.5 1.5-4 4-4 0 2.5-1.5 4-4 4z" fill="var(--brand)"/></svg>
      팜시그널
    </div>
    <div class="asof" id="asof"><b>&nbsp;</b>불러오는 중</div>
  </div>
</header>

<main class="wrap" id="app">
  <div class="view"><div class="card"><div class="skel" style="width:60%"></div><div class="skel" style="margin-top:12px"></div><div class="skel" style="margin-top:8px;width:80%"></div></div></div>
</main>

<nav class="tabs" aria-label="메뉴">
  <div class="wrap">
    <a href="#home" data-tab="home"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>오늘</a>
    <a href="#market" data-tab="market"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg>시세</a>
    <a href="#watch" data-tab="watch"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>관심</a>
    <a href="#method" data-tab="method"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>분석 방법</a>
  </div>
</nav>

<script>
(() => {
  "use strict";
  const DATA = "data/";
  const app = document.getElementById("app");
  const state = { meta: null, overview: null, catalog: null, cache: new Map(),
                  cls: "02", cat: "all", sort: "vs_normal", q: "", range: 250, moversTab: "up" };

  // ---------- 저장(관심 품목) ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem("fs:" + k); return v ? JSON.parse(v) : d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem("fs:" + k, JSON.stringify(v)); } catch {} }
  };
  let watch = new Set(store.get("watch", []));
  Object.assign(state, store.get("prefs", {}));
  const savePrefs = () => store.set("prefs", { cls: state.cls, sort: state.sort, range: state.range });

  // ---------- 포맷 ----------
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const won = v => v == null ? "–" : Math.round(v).toLocaleString("ko-KR");
  const pctTxt = (v, d = 1) => v == null ? "–" : (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v * 100).toFixed(d) + "%";
  const dir = v => v == null || Math.abs(v) < 0.0005 ? "flat" : v > 0 ? "up" : "down";
  const arrow = v => v == null || Math.abs(v) < 0.0005 ? "" : v > 0 ? "▲" : "▼";
  const delta = (v, d) => `<span class="delta ${dir(v)}">${arrow(v)}${v == null ? "–" : (Math.abs(v * 100)).toFixed(d ?? 1) + "%"}</span>`;
  const DOW = ["일", "월", "화", "수", "목", "금", "토"];
  const fmtDate = (iso, withDow) => { const d = new Date(iso + "T00:00:00"); return `${d.getMonth() + 1}월 ${d.getDate()}일` + (withDow ? ` (${DOW[d.getDay()]})` : ""); };
  const cleanKind = s => String(s || "").replace(/\([^)]*\)$/, "").trim();
  const label = s => { const k = cleanKind(s.kind); return k && k !== s.item ? `${s.item} <span class="tag">${esc(k)}</span>` : esc(s.item); };
  const pill = s => `<span class="pill ${esc(s.signal)}">${esc(s.signal_label)}</span>`;

  async function getJSON(path) {
    if (state.cache.has(path)) return state.cache.get(path);
    const res = await fetch(DATA + path);
    if (!res.ok) throw new Error(`${path}: ${res.status}`);
    const data = await res.json();
    state.cache.set(path, data);
    return data;
  }

  // ---------- 라우팅 ----------
  function route() {
    const h = location.hash.replace(/^#/, "") || "home";
    const tab = h.startsWith("item-") ? "market" : h;
    document.querySelectorAll(".tabs a").forEach(a => {

  // ---------- 도매시장(가락) 경락가·반입량 ----------
  const tons = kg => kg == null ? "–" : kg >= 1e5 ? (kg / 1000).toFixed(0) + "톤" : kg >= 1000 ? (kg / 1000).toFixed(1) + "톤" : Math.round(kg) + "kg";
  function wholesaleCard(w) {

      <div class="chart-wrap" id="whp"></div>
      <div class="k flat" style="font-size:12px;margin:12px 0 2px">하루 반입량 · 최근 3개월</div>
      <div class="chart-wrap" id="whv"></div>

    </section>`;
  }
  function drawWholesale(w) {
    const H = w.history, n = H.dates.length, st = Math.max(0, n - 60);
    const dates = H.dates.slice(st), px = H.price_kg.slice(st), kg = H.kg.slice(st);
    const avg = kg.map((_, i) => i < 19 ? null : kg.slice(i - 19, i + 1).reduce((a, b) => a + b, 0) / 20);
    miniChart(document.getElementById("whp"), dates, px, null, "line", v => won(v) + "원/kg");
    miniChart(document.getElementById("whv"), dates, kg, avg, "bar", v => tons(v));
  }
  function miniChart(el, dates, vals, line2, kind, fmt) {
    if (!el) return;
    const N = vals.length, W = Math.max(280, el.clientWidth), Ht = 120, m = { l: 6, r: 46, t: 8, b: 20 };
    const all = vals.concat(line2 || []).filter(v => v != null);

    const ticks = niceTicks(lo, hi, 3); lo = kind === "bar" ? 0 : Math.min(lo, ticks[0]); hi = Math.max(hi, ticks[ticks.length - 1]);
    const bw = (W - m.l - m.r) / N;

    ticks.forEach(t => { if (t < lo || t > hi) return; s += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" ${t === ticks[0] ? "" : 'stroke-dasharray="2 4"'}/><text x="${W - m.r + 6}" y="${y(t) + 3.5}">${kind === "bar" ? tons(t) : shortWon(t)}</text>`; });
    let lastM = "";
    dates.forEach((d, i) => { const mm = d.slice(5, 7); if (mm !== lastM) { if (lastM && i > 2 && i < N - 3) s += `<text x="${x(i)}" y="${Ht - 4}" text-anchor="middle">${+mm}월</text>`; lastM = mm; } });
    if (kind === "bar") {
      vals.forEach((v, i) => { if (v == null) return; const h = Math.max(1, y(lo) - y(v)); s += `<rect x="${(x(i) - bw * .36).toFixed(1)}" y="${(y(lo) - h).toFixed(1)}" width="${Math.max(1, bw * .72).toFixed(1)}" height="${h.toFixed(1)}" rx="1.5" fill="${i >= N - 5 ? "var(--fg-2)" : "var(--normal)"}" opacity="${i >= N - 5 ? .9 : .55}"/>`; });
      if (line2) { let p = ""; line2.forEach((v, i) => { if (v != null) p += (p ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1); }); s += `<path d="${p}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="5 3"/>`; }
    } else {
      let p = ""; vals.forEach((v, i) => { if (v != null) p += (p ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1); });

      const li = N - 1; if (vals[li] != null) s += `<circle cx="${x(li)}" cy="${y(vals[li])}" r="4" fill="var(--fg)" stroke="var(--surface)" stroke-width="2"/>`;
    }

    el.innerHTML = s;
    const hit = el.querySelector(".hit"), hl = el.querySelector(".hl"), tip = el.querySelector(".tip");
    const show = ev => {
      const r = el.getBoundingClientRect(), sx = (ev.clientX - r.left) * (W / r.width);
      const i = Math.max(0, Math.min(N - 1, Math.floor((sx - m.l) / bw)));
      hl.style.display = ""; hl.setAttribute("x1", x(i)); hl.setAttribute("x2", x(i));
      tip.hidden = false; tip.innerHTML = `${fmtDate(dates[i], true)}<br><b>${vals[i] == null ? "–" : fmt(vals[i])}</b>`;

  // ---------- 차트 (SVG, 손으로 그림: 예측 범위·평년선·구간 끊김 처리) ----------
  let resizeChart = null;
  function drawChart(el, d, nRange) {
    const H = d.history, fc = d.forecast;
    const n = H.dates.length, start = Math.max(0, n - nRange);
    const hist = []; for (let i = start; i < n; i++) hist.push({ date: H.dates[i], p: H.price[i], ma: H.ma20[i], nm: H.normal[i] });
    const fut = fc ? fc.dates.map((dt, i) => ({ date: dt, c: fc.center[i], lo: fc.lo80[i], hi: fc.hi80[i] })) : [];
    const N = hist.length + fut.length;
    const W = Math.max(280, el.clientWidth), Ht = 230, m = { l: 8, r: 46, t: 14, b: 24 };
    const vals = [];
    hist.forEach(h => { vals.push(h.p); if (h.nm != null) vals.push(h.nm); if (h.ma != null) vals.push(h.ma); });
    fut.forEach(f => vals.push(f.lo, f.hi));
    let lo = Math.min(...vals), hi = Math.max(...vals);
    const ticks = niceTicks(lo, hi, 4); lo = Math.min(lo, ticks[0]); hi = Math.max(hi, ticks[ticks.length - 1]);
    const x = i => m.l + (N <= 1 ? 0 : i / (N - 1)) * (W - m.l - m.r);
    const y = v => m.t + (1 - (v - lo) / (hi - lo || 1)) * (Ht - m.t - m.b);
    // 21일 넘게 비면 선을 끊는다(비수기)
    const gap = (a, b) => (new Date(b) - new Date(a)) / 864e5 > 21;
    const path = (arr, get) => {
      let s = "", pen = false;
      arr.forEach((o, i) => {
        const v = get(o);
        if (v == null || (i > 0 && gap(arr[i - 1].date, o.date))) { pen = false; if (v == null) return; }
        s += (pen ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1); pen = true;
      });
      return s;
    };
    const iNow = hist.length - 1;
    let svg = `<svg viewBox="0 0 ${W} ${Ht}" height="${Ht}" role="img" aria-label="${esc(d.item)} 가격 추이 차트">`;
    ticks.forEach(t => { if (t < lo || t > hi) return; svg += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1" ${t === ticks[0] ? "" : 'stroke-dasharray="2 4"'}/><text x="${W - m.r + 6}" y="${y(t) + 3.5}">${shortWon(t)}</text>`; });
    // x 눈금: 월 시작
    const marks = []; let lastM = "";
    [...hist, ...fut].forEach((o, i) => { const mm = o.date.slice(0, 7); if (mm !== lastM) { marks.push([i, mm]); lastM = mm; } });
    const every = Math.ceil(marks.length / 5);
    marks.forEach(([i, mm], k) => { if (k === 0 && i < 3) return; if (k % every) return; const [yy, mo] = mm.split("-"); svg += `<text x="${x(i)}" y="${Ht - 6}" text-anchor="middle">${+mo === 1 || nRange > 300 && k === 0 ? yy.slice(2) + "." : ""}${+mo}월</text>`; });
    if (fut.length) {
      const band = fut.map((f, i) => `${x(iNow + 1 + i).toFixed(1)} ${y(f.hi).toFixed(1)}`);
      const bandLo = fut.map((f, i) => `${x(iNow + 1 + i).toFixed(1)} ${y(f.lo).toFixed(1)}`).reverse();
      svg += `<path d="M${x(iNow)} ${y(hist[iNow].p)} L${band.join(" L")} L${bandLo.join(" L")} Z" fill="var(--band)"/>`;
      svg += `<line x1="${x(iNow)}" x2="${x(iNow)}" y1="${m.t - 6}" y2="${Ht - m.b}" stroke="var(--fg-3)" stroke-width="1" stroke-dasharray="3 3"/>`;
      svg += `<text x="${x(iNow) - 4}" y="${m.t - 2}" text-anchor="end" style="fill:var(--fg-2)">오늘</text>`;
    }
    svg += `<path d="${path(hist, o => o.nm)}" fill="none" stroke="var(--normal)" stroke-width="1.5" stroke-dasharray="5 4"/>`;
    svg += `<path d="${path(hist, o => o.ma)}" fill="none" stroke="var(--fg-3)" stroke-width="1.5" opacity=".8"/>`;
    svg += `<path d="${path(hist, o => o.p)}" fill="none" stroke="var(--fg)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    if (fut.length) {
      svg += `<path d="M${x(iNow)} ${y(hist[iNow].p)} ${fut.map((f, i) => `L${x(iNow + 1 + i).toFixed(1)} ${y(f.c).toFixed(1)}`).join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="5 3"/>`;
      const lf = fut[fut.length - 1];

    svg += `<g id="hov" style="display:none"><line id="hl" y1="${m.t}" y2="${Ht - m.b}" stroke="var(--fg-2)" stroke-width="1"/><circle id="hc" r="4.5" fill="var(--surface)" stroke-width="2.5"/></g>`;
    svg += `<rect x="0" y="0" width="${W}" height="${Ht}" fill="transparent" id="hit"/></svg><div class="tip" id="tip" hidden></div>`;
    el.innerHTML = svg;

    const hit = el.querySelector("#hit"), hov = el.querySelector("#hov"), tip = el.querySelector("#tip");
    const show = ev => {
      const r = el.getBoundingClientRect();
      const px = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left;
      const sx = px * (W / r.width);
      let i = Math.round((sx - m.l) / (W - m.l - m.r) * (N - 1)); i = Math.max(0, Math.min(N - 1, i));

      const c = el.querySelector("#hc"); c.setAttribute("cx", x(i)); c.setAttribute("cy", y(v)); c.setAttribute("stroke", isF ? "var(--accent)" : "var(--fg)");
      tip.hidden = false;
      tip.innerHTML = isF
        ? `${fmtDate(o.date, true)} <span style="opacity:.7">예측</span><br><b>${won(o.c)}원</b><br><span style="opacity:.75">${won(o.lo)} ~ ${won(o.hi)}</span>`
        : `${fmtDate(o.date, true)}<br><b>${won(o.p)}원</b>${o.nm != null ? `<br><span style="opacity:.75">평년 ${won(o.nm)}</span>` : ""}`;

  }

    const id = location.hash.startsWith("#item-") && location.hash.slice(6), d = id && state.cache.get(`series/${id}.json`);
    if (d && d.wholesale) drawWholesale(d.wholesale);

  function niceTicks(lo, hi, count) {

  // 같은 품목의 상품/중품이 나란히 나오지 않게 품목·품종당 하나만(목록 순서상 먼저 나온 것)

  // ---------- 분석 방법 ----------
  function renderMethod() {

    app.innerHTML = `<div class="view">

  async function boot() {
    try {
      const [meta, overview, catalog] = await Promise.all([getJSON("meta.json"), getJSON("overview.json"), getJSON("catalog.json")]);
      Object.assign(state, { meta, overview, catalog });
      if (!["01", "02"].includes(state.cls)) state.cls = "02";

      if (!SORTS[state.sort]) state.sort = "vs_normal";
      window.addEventListener("hashchange", route);
      route();
    } catch (e) {
      app.innerHTML = `<div class="view"><div class="card empty"><b>시세 자료를 불러오지 못했어요</b>잠시 후 새로고침해 주세요. 계속되면 자료 갱신 작업이 실패했을 수 있어요.</div></div>`;
      document.getElementById("asof").innerHTML = "<b>&nbsp;</b>연결 오류";
    }
  }
